<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/style.css">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- Header section -->
    <div id="bod">
     <header>
        <h1 class="text-2xl font-bold pb-5">Todo List Linnn</h1>
     </header>

     <!-- Main Content -->
      <div id="main">
      <main>
        <section class="form-section">
            <form>
                <!-- Todo input -->
                 <input type="text" id="todo-input" class="border rounded p-2" placeholder="Enter a todo item">

                 <!-- Date input -->
                  <input type="date" id="todo-date" class="border rounded p-2">


                  <!-- action section -->

                 <section  class="flex pt-2 justify-between">
                    <!-- button input -->
                    <button type="button" onclick="addTodo()" class="border rounded p-2 bg-green-500 text-white">Add Todo</button>
                    <button class="border rounded p-2 bg-blue-500 text-white">Filter</button>
                    
                    <button class="border rounded p-2 bg-red-500 text-white">Clear</button>
                 </section>
                <!-- Todo List section -->
                 <section class="flex pt-2">
                    <header>
                        <h1 class="text-2xl font-semibold">List of Todo</h1>
                    </header>

                    <ul class="pt-2" id="todo-list">
                        <li>List nya kosong nih</li>
                    </ul>
                 </section>

            </form>
        </section>
      </main>
      </div>

      <!-- footer -->
       <footer class="pt-5">
        <p>© 2025 Todo List</p>
       </footer>
    </div>

       <script src="js/script.js"></script>
</body>
</html>
